name: Finish raw AGS VertexParameter

on:
  push:
    branches: [amd-spirv-native-intrinsics-dev]
  pull_request:
    branches: [amd-spirv-native-intrinsics]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finish-raw-ags-vtxparam
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'amd-spirv-native-intrinsics-dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: amd-spirv-native-intrinsics-dev
          submodules: recursive
          fetch-depth: 1

      - name: Stage compiler implementation
        run: |
          set -euo pipefail
          command -v clang-format
          command -v ninja
          python3 - <<'PY'
          from pathlib import Path
          p = Path('utils/amd_finish_vertex_parameter.py')
          text = p.read_text(encoding='utf-8')
          if 'processVkReadClock' not in text:
              raise SystemExit('stale processVkReadClock anchor not found')
          text = text.replace('processVkReadClock', 'processIntrinsicReadClock')
          text = text.replace('processIntrinsicReadClock(const CallExpr *callExpr)',
                              'processIntrinsicReadClock(const CallExpr *)')
          p.write_text(text, encoding='utf-8')

          p = Path('utils/amd_finalize_vertex_parameter.py')
          text = p.read_text(encoding='utf-8')
          old = r'\(UINT\)IntrinsicOp::'
          new = r'\(UINT\)hlsl::IntrinsicOp::'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'unexpected HCT opcode regex count: {count}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 utils/amd_finish_vertex_parameter.py
          python3 utils/amd_finalize_vertex_parameter.py
          python3 utils/hct/hctgen.py HLSLIntrinsicOp --output include/dxc/HlslIntrinsicOp.h
          clang-format -i include/dxc/HlslIntrinsicOp.h

      - name: Validate staged source
        run: |
          set -euo pipefail
          python3 -m py_compile \
            utils/amd_spirv_ci.py \
            utils/amd_math_ci.py \
            utils/amd_subgroup_ci.py \
            utils/amd_atomic_ci.py \
            utils/amd_packing_ci.py \
            utils/amd_bfloat16_ci.py \
            utils/amd_matrix_ci.py \
            utils/amd_mixed_dot_ci.py \
            utils/amd_dxil_ci.py \
            utils/amd_finalize_vertex_parameter.py
          python3 -m json.tool utils/hct/hlsl_intrinsic_opcodes.json >/dev/null
          python3 -m json.tool utils/amd_spirv_contracts.json >/dev/null
          python3 -m json.tool utils/apusr_amd_ingress_blockers.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          with open('utils/hct/hlsl_intrinsic_opcodes.json', encoding='utf-8') as f:
              ops = json.load(f)['IntrinsicOpCodes']
          assert ops['IOP_VkAmdVertexParameter'] == 424
          assert ops['IOP_VkAmdVertexParameterComponent'] == 425
          assert ops['Num_Intrinsics'] == 426

          cmake = Path('tools/clang/lib/Lex/CMakeLists.txt').read_text(encoding='utf-8')
          headers_root = Path('tools/clang/lib/Headers/hlsl')
          missing = []
          for public_dir in ('dx/amd', 'vk/amd'):
              for header in sorted((headers_root / public_dir).glob('*.h')):
                  rel = header.relative_to(headers_root).as_posix()
                  if rel not in cmake:
                      missing.append(rel)
          if missing:
              raise SystemExit('public AMD HLSL headers missing from embedded inputs: ' +
                               ', '.join(missing))
          PY
          git diff --check
          grep -q 'IOP_VkAmdVertexParameter = 424' include/dxc/HlslIntrinsicOp.h
          grep -q 'IOP_VkAmdVertexParameterComponent = 425' include/dxc/HlslIntrinsicOp.h
          grep -q 'case LICOMPTYPE_FLOAT' tools/clang/lib/Sema/SemaHLSL.cpp
          grep -q 'IOP_VkAmdVertexParameter' lib/HLSL/HLOperationLower.cpp
          grep -q 'processAmdVertexParameter' tools/clang/lib/SPIRV/SpirvEmitter.cpp
          grep -q 'getAmdVertexParameterComponentPtr' tools/clang/lib/SPIRV/DeclResultIdMapper.cpp
          ! grep -q 'ags-vtxparam-raw-signature-index' utils/apusr_amd_ingress_blockers.json

      - name: Configure and build Linux DXC
        run: |
          set -euo pipefail
          cmake -S . -B build-amd-spirv -G Ninja \
            -C cmake/caches/PredefinedParams.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_SPIRV_CODEGEN=ON \
            -DSPIRV_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DHLSL_INCLUDE_TESTS=OFF
          cmake --build build-amd-spirv --target dxc dxcompiler dxildll --parallel 4

      - name: Smoke intrinsic registration
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build-amd-spirv/lib:${LD_LIBRARY_PATH:-}"
          DXC="$PWD/build-amd-spirv/bin/dxc"
          cat >/tmp/plain.hlsl <<'HLSL'
          RWStructuredBuffer<uint> outBuffer : register(u0);
          [numthreads(1, 1, 1)]
          void main(uint3 tid : SV_DispatchThreadID) { outBuffer[0] = tid.x; }
          HLSL
          "$DXC" -T cs_6_2 -E main -fcgl -spirv /tmp/plain.hlsl -Fo /tmp/plain.spv
          set +e
          "$DXC" -T cs_6_2 -E main -fcgl -spirv -fspv-extension=AMD \
            tools/clang/test/CodeGenSPIRV/amd.intrinsics.header.hlsl \
            -Fo /tmp/amd-header.spv
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "AMD header smoke failed with rc=$rc"
            sudo apt-get update >/dev/null && sudo apt-get install -y gdb >/dev/null
            gdb --batch -ex 'set pagination off' -ex run -ex 'thread apply all bt full' \
              --args "$DXC" -T cs_6_2 -E main -fcgl -spirv -fspv-extension=AMD \
              tools/clang/test/CodeGenSPIRV/amd.intrinsics.header.hlsl \
              -Fo /tmp/amd-header-gdb.spv || true
            exit "$rc"
          fi

      - name: Run Linux AMD compiler contracts
        run: |
          set -uo pipefail
          export LD_LIBRARY_PATH="$PWD/build-amd-spirv/lib:${LD_LIBRARY_PATH:-}"
          DXC="$PWD/build-amd-spirv/bin/dxc"
          status=0
          for test in \
            amd_spirv_ci.py \
            amd_math_ci.py \
            amd_subgroup_ci.py \
            amd_atomic_ci.py \
            amd_packing_ci.py \
            amd_bfloat16_ci.py \
            amd_matrix_ci.py \
            amd_mixed_dot_ci.py \
            amd_dxil_ci.py
          do
            echo "===== $test ====="
            python3 "utils/$test" --dxc "$DXC" || status=1
          done
          exit "$status"

      - name: Commit final implementation
        run: |
          set -euo pipefail
          rm utils/amd_finish_vertex_parameter.py
          rm utils/amd_finalize_vertex_parameter.py
          rm .github/workflows/agent-finish-vtxparam.yml
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finish raw AGS VertexParameter parity [full-ci]'
          git push origin HEAD:amd-spirv-native-intrinsics-dev

  windows-final:
    name: Windows final compiler + contracts
    needs: apply
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout final dev branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: amd-spirv-native-intrinsics-dev
          submodules: recursive
          fetch-depth: 1

      - name: Configure and build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          cmake -S . -B build-amd-spirv -G Ninja -C cmake\caches\PredefinedParams.cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_SPIRV_CODEGEN=ON -DSPIRV_BUILD_TESTS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_BUILD_TESTS=OFF -DCLANG_INCLUDE_TESTS=OFF -DHLSL_INCLUDE_TESTS=OFF
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build-amd-spirv --target dxc dxcompiler dxildll --parallel 4
          if errorlevel 1 exit /b %errorlevel%

      - name: Run Windows AMD compiler contracts
        shell: pwsh
        run: |
          $dxc = Join-Path $PWD 'build-amd-spirv\bin\dxc.exe'
          $tests = @(
            'amd_spirv_ci.py','amd_math_ci.py','amd_subgroup_ci.py',
            'amd_atomic_ci.py','amd_packing_ci.py','amd_bfloat16_ci.py',
            'amd_matrix_ci.py','amd_mixed_dot_ci.py','amd_dxil_ci.py'
          )
          $failed = $false
          foreach ($test in $tests) {
            Write-Host "===== $test ====="
            python (Join-Path 'utils' $test) --dxc $dxc
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
