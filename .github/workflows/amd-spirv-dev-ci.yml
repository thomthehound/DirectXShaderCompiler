name: AMD SPIR-V Dev CI

on:
  push:
    branches:
      - amd-spirv-native-intrinsics-dev
  workflow_dispatch:

# This is an integration branch with frequent incremental commits. Do not burn
# runners proving an obsolete commit after a newer commit has already landed.
concurrency:
  group: amd-spirv-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate inventories and Python runners
        run: |
          set -euo pipefail
          python3 utils/apusr_amd_experimental_inventory.py
          python3 -m json.tool utils/apusr_amd_acceleration_matrix.json >/dev/null
          python3 -m json.tool utils/apusr_amd_experimental_candidates.json >/dev/null
          python3 -m json.tool utils/apusr_amd_ingress_blockers.json >/dev/null
          python3 -m json.tool utils/amd_contract_addendum_matrix_packing.json >/dev/null
          python3 -m py_compile \
            utils/apusr_amd_qualify.py \
            utils/apusr_amd_experimental_inventory.py \
            utils/amd_spirv_ci.py \
            utils/amd_math_ci.py \
            utils/amd_subgroup_ci.py \
            utils/amd_dxil_ci.py \
            utils/amd_atomic_ci.py \
            utils/amd_packing_ci.py \
            utils/amd_matrix_ci.py \
            utils/amd_mixed_dot_ci.py \
            utils/amd_vulkan_isa_probe/native_probe.py \
            utils/amd_vulkan_isa_probe/math_probe.py \
            utils/amd_vulkan_isa_probe/dot_probe.py \
            utils/amd_vulkan_isa_probe/dot_f16_probe.py \
            utils/amd_vulkan_isa_probe/dot_saturation_probe.py \
            utils/amd_vulkan_isa_probe/mixed_dot_probe.py \
            utils/amd_vulkan_isa_probe/crosslane_probe.py \
            utils/amd_vulkan_isa_probe/reduction_probe.py \
            utils/amd_vulkan_isa_probe/conversion_probe.py \
            utils/amd_vulkan_isa_probe/packing_probe.py \
            utils/amd_vulkan_isa_probe/matrix_probe.py \
            utils/amd_vulkan_isa_probe/transcendental_probe.py \
            utils/amd_vulkan_isa_probe/lds_probe.py \
            utils/amd_vulkan_isa_probe/cube_probe.py \
            utils/amd_vulkan_isa_probe/candidate_zoo.py

  build-linux:
    name: Linux compiler + contracts
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld

      - name: Configure
        run: |
          cmake -S . -B build-amd-spirv -G Ninja \
            -C cmake/caches/PredefinedParams.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_USE_LINKER=lld \
            -DENABLE_SPIRV_CODEGEN=ON \
            -DSPIRV_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DHLSL_INCLUDE_TESTS=OFF

      - name: Build DXC
        run: cmake --build build-amd-spirv --target dxc dxcompiler dxildll --parallel 4

      - name: Smoke DXIL and SPIR-V
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build-amd-spirv/lib:${LD_LIBRARY_PATH:-}"
          cat > "$RUNNER_TEMP/amd_dxc_smoke.hlsl" <<'EOF'
          RWStructuredBuffer<uint> Out : register(u0);
          [numthreads(1,1,1)]
          void main(uint3 tid : SV_DispatchThreadID) { Out[0] = tid.x + 1; }
          EOF
          build-amd-spirv/bin/dxc -T cs_6_6 -E main -Fo "$RUNNER_TEMP/amd_dxc_smoke.dxil" "$RUNNER_TEMP/amd_dxc_smoke.hlsl"
          build-amd-spirv/bin/dxc -spirv -fspv-target-env=vulkan1.2 -T cs_6_6 -E main -Fo "$RUNNER_TEMP/amd_dxc_smoke.spv" "$RUNNER_TEMP/amd_dxc_smoke.hlsl"
          test -s "$RUNNER_TEMP/amd_dxc_smoke.dxil"
          test -s "$RUNNER_TEMP/amd_dxc_smoke.spv"

      - name: AMD compiler contracts
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build-amd-spirv/lib:${LD_LIBRARY_PATH:-}"
          DXC="$PWD/build-amd-spirv/bin/dxc"
          python3 utils/amd_spirv_ci.py --dxc "$DXC"
          python3 utils/amd_math_ci.py --dxc "$DXC"
          python3 utils/amd_subgroup_ci.py --dxc "$DXC"
          python3 utils/amd_atomic_ci.py --dxc "$DXC"
          python3 utils/amd_packing_ci.py --dxc "$DXC"
          python3 utils/amd_matrix_ci.py --dxc "$DXC"
          python3 utils/amd_mixed_dot_ci.py --dxc "$DXC"
          python3 utils/amd_dxil_ci.py --dxc "$DXC"

  build-windows:
    name: Windows compiler + contracts
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-ci]') }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure and build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          cmake -S . -B build-amd-spirv -G Ninja -C cmake\caches\PredefinedParams.cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_SPIRV_CODEGEN=ON -DSPIRV_BUILD_TESTS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_BUILD_TESTS=OFF -DCLANG_INCLUDE_TESTS=OFF -DHLSL_INCLUDE_TESTS=OFF
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build-amd-spirv --target dxc dxcompiler dxildll --parallel 4
          if errorlevel 1 exit /b %errorlevel%

      - name: Smoke DXIL and SPIR-V
        shell: pwsh
        run: |
          @'
          RWStructuredBuffer<uint> Out : register(u0);
          [numthreads(1,1,1)]
          void main(uint3 tid : SV_DispatchThreadID) { Out[0] = tid.x + 1; }
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\amd_dxc_smoke.hlsl" -Encoding Ascii
          $dxc = Join-Path $PWD 'build-amd-spirv\bin\dxc.exe'
          $source = "$env:RUNNER_TEMP\amd_dxc_smoke.hlsl"
          $dxil = "$env:RUNNER_TEMP\amd_dxc_smoke.dxil"
          $spirv = "$env:RUNNER_TEMP\amd_dxc_smoke.spv"
          & $dxc -T cs_6_6 -E main -Fo $dxil $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $dxc -spirv -fspv-target-env=vulkan1.2 -T cs_6_6 -E main -Fo $spirv $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item -LiteralPath $dxil).Length -eq 0) { throw 'DXIL smoke output is empty' }
          if ((Get-Item -LiteralPath $spirv).Length -eq 0) { throw 'SPIR-V smoke output is empty' }

      - name: AMD compiler contracts
        shell: pwsh
        run: |
          $dxc = Join-Path $PWD 'build-amd-spirv\bin\dxc.exe'
          python utils/amd_spirv_ci.py --dxc $dxc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python utils/amd_math_ci.py --dxc $dxc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python utils/amd_subgroup_ci.py --dxc $dxc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python utils/amd_atomic_ci.py --dxc $dxc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python utils/amd_packing_ci.py --dxc $dxc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python utils/amd_matrix_ci.py --dxc $dxc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python utils/amd_mixed_dot_ci.py --dxc $dxc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python utils/amd_dxil_ci.py --dxc $dxc
          exit $LASTEXITCODE
