name: Raw Buffer Vectorization CI

on:
  push:
    branches:
      - amd-raw-buffer-vectorization-impl
    paths-ignore:
      - '.github/workflows/raw-buffer-vectorization-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raw-buffer-vectorization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows focused compiler validation
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # TEMPORARY: the connected GitHub tool can replace whole files but cannot
      # apply narrow patches to the large DXC translation units. Apply the exact
      # reviewed edits in the runner, commit them to this feature branch, and
      # validate that same working tree. Remove this step after the fix lands.
      - name: Apply exact raw-buffer compiler fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_exact(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              data = path.read_bytes()
              eol = b"\r\n" if b"\r\n" in data else b"\n"
              old_bytes = old.replace("\n", eol.decode()).encode()
              new_bytes = new.replace("\n", eol.decode()).encode()
              old_count = data.count(old_bytes)
              new_count = data.count(new_bytes)
              if old_count == 1:
                  path.write_bytes(data.replace(old_bytes, new_bytes, 1))
                  print(f"patched {path_name}")
              elif old_count == 0 and new_count == 1:
                  print(f"already patched {path_name}")
              else:
                  raise RuntimeError(
                      f"{path_name}: expected one old block or one new block, "
                      f"found old={old_count} new={new_count}"
                  )

          def replace_all_exact(path_name: str, old: str, new: str, expected: int) -> None:
              path = Path(path_name)
              data = path.read_bytes()
              eol = b"\r\n" if b"\r\n" in data else b"\n"
              old_bytes = old.replace("\n", eol.decode()).encode()
              new_bytes = new.replace("\n", eol.decode()).encode()
              old_count = data.count(old_bytes)
              new_count = data.count(new_bytes)
              if old_count == expected:
                  path.write_bytes(data.replace(old_bytes, new_bytes))
                  print(f"patched {path_name}: {expected} replacements")
              elif old_count == 0 and new_count == expected:
                  print(f"already patched {path_name}: {expected} replacements")
              else:
                  raise RuntimeError(
                      f"{path_name}: expected old={expected} or new={expected}, "
                      f"found old={old_count} new={new_count}"
                  )

          replace_exact(
              "tools/clang/lib/SPIRV/DeclResultIdMapper.cpp",
              '''  if (useUntypedRawBuffer) {
            const auto *pointerType =
                spvContext.getUntypedPointerKHRType(storageClass);
            const auto *dataType =
                spvContext.getByteAddressBufferType(isRWByteAddressBuffer(type));
            auto *untypedVar = spvBuilder.createUntypedVariableKHR(
                pointerType, storageClass, name, loc, dataType);
          ''',
              '''  if (useUntypedRawBuffer) {
            // Vulkan raw buffers are storage buffers. Keep the legacy typed
            // descriptor representation unchanged; only the opt-in untyped path
            // uses the modern StorageBuffer storage class.
            const auto untypedStorageClass = spv::StorageClass::StorageBuffer;
            const auto *pointerType =
                spvContext.getUntypedPointerKHRType(untypedStorageClass);
            const auto *dataType =
                spvContext.getByteAddressBufferType(isRWByteAddressBuffer(type));
            auto *untypedVar = spvBuilder.createUntypedVariableKHR(
                pointerType, untypedStorageClass, name, loc, dataType);
          ''',
          )

          replace_exact(
              "tools/clang/lib/SPIRV/LowerTypeVisitor.cpp",
              '''  // ByteAddressBuffer and RWByteAddressBuffer types. The concrete descriptor
            // Data Type remains the existing raw-buffer block. Resource *values* use an
            // untyped Uniform pointer only when the extension was explicitly requested;
            // this naturally covers local aliases, function parameters/returns, and
            // resource fields without changing typed resource-array element layout.
            if (name == "ByteAddressBuffer" || name == "RWByteAddressBuffer" ||
                name == "RasterizerOrderedByteAddressBuffer") {
              const auto *bufferType = spvContext.getByteAddressBufferType(
                  /*isRW*/ name != "ByteAddressBuffer");
              if (rule == SpirvLayoutRule::Void) {
                if (!getCodeGenOptions().allowedExtensions.empty() &&
                    spvBuilder.isExtensionEnabled(Extension::KHR_untyped_pointers))
                  return spvContext.getUntypedPointerKHRType(spv::StorageClass::Uniform);
                return spvContext.getPointerType(bufferType, spv::StorageClass::Uniform);
              }
              return bufferType;
            }
          ''',
              '''  // ByteAddressBuffer and RWByteAddressBuffer types. The concrete descriptor
            // Data Type remains the existing raw-buffer block. Resource *values* use an
            // untyped StorageBuffer pointer only when the extension was explicitly
            // requested; this naturally covers local aliases, function parameters/returns,
            // and resource fields without changing typed resource-array element layout.
            if (name == "ByteAddressBuffer" || name == "RWByteAddressBuffer" ||
                name == "RasterizerOrderedByteAddressBuffer") {
              const auto *bufferType = spvContext.getByteAddressBufferType(
                  /*isRW*/ name != "ByteAddressBuffer");
              if (rule == SpirvLayoutRule::Void) {
                if (!getCodeGenOptions().allowedExtensions.empty() &&
                    spvBuilder.isExtensionEnabled(Extension::KHR_untyped_pointers))
                  return spvContext.getUntypedPointerKHRType(
                      spv::StorageClass::StorageBuffer);
                return spvContext.getPointerType(bufferType, spv::StorageClass::Uniform);
              }
              return bufferType;
            }
          ''',
          )

          replace_exact(
              "tools/clang/lib/SPIRV/SpirvBuilder.cpp",
              '''  if (pointer->containsAliasComponent() &&
                isAKindOfStructuredOrByteBuffer(resultType)) {
              instruction->setStorageClass(spv::StorageClass::Uniform);
              // Now it is a pointer to the global resource, which is lvalue.
          ''',
              '''  if (pointer->containsAliasComponent() &&
                isAKindOfStructuredOrByteBuffer(resultType)) {
              const bool useUntypedRawBuffer =
                  !spirvOptions.allowedExtensions.empty() &&
                  featureManager.isExtensionEnabled(Extension::KHR_untyped_pointers) &&
                  (isByteAddressBuffer(resultType) || isRWByteAddressBuffer(resultType));
              instruction->setStorageClass(useUntypedRawBuffer
                                               ? spv::StorageClass::StorageBuffer
                                               : spv::StorageClass::Uniform);
              // Now it is a pointer to the global resource, which is lvalue.
          ''',
          )

          replace_exact(
              "tools/clang/lib/SPIRV/SpirvBuilder.cpp",
              '''  if (context.hasLoweredType(pointer)) {
              // preserve distinct node payload array types
              auto *ptrType = dyn_cast<SpirvPointerType>(pointer->getResultType());
              instruction->setResultType(ptrType->getPointeeType());
              context.addToInstructionsWithLoweredType(instruction);
            }
          ''',
              '''  if (context.hasLoweredType(pointer)) {
              // Preserve distinct node payload array types. Untyped pointers have
              // no pointee type; their load result is lowered from the AST result
              // type by the normal type-lowering pass.
              if (auto *ptrType =
                      dyn_cast<SpirvPointerType>(pointer->getResultType())) {
                instruction->setResultType(ptrType->getPointeeType());
                context.addToInstructionsWithLoweredType(instruction);
              } else {
                assert(isa<UntypedPointerKHRType>(pointer->getResultType()) &&
                       "lowered pointer must be typed or untyped");
              }
            }
          ''',
          )

          replace_exact(
              "tools/clang/lib/SPIRV/SpirvBuilder.cpp",
              '''  if (func->constainsAliasComponent() &&
                isAKindOfStructuredOrByteBuffer(returnType)) {
              instruction->setStorageClass(spv::StorageClass::Uniform);
              // Now it is a pointer to the global resource, which is lvalue.
          ''',
              '''  if (func->constainsAliasComponent() &&
                isAKindOfStructuredOrByteBuffer(returnType)) {
              const bool useUntypedRawBuffer =
                  !spirvOptions.allowedExtensions.empty() &&
                  featureManager.isExtensionEnabled(Extension::KHR_untyped_pointers) &&
                  (isByteAddressBuffer(returnType) || isRWByteAddressBuffer(returnType));
              instruction->setStorageClass(useUntypedRawBuffer
                                               ? spv::StorageClass::StorageBuffer
                                               : spv::StorageClass::Uniform);
              // Now it is a pointer to the global resource, which is lvalue.
          ''',
          )

          probe = "utils/amd_vulkan_isa_probe/raw_buffer_vector_probe.py"
          replace_exact(
              probe,
              '''    else:
                ok = (
                    not untyped
                    and c["OpCompositeConstruct"] >= 1
                    and c["OpCompositeExtract"] >= 4
                )
                case.classification = "typed-alias-compatible" if ok else "legacy-alias-changed"
          ''',
              '''    else:
                # The optimized legacy Load4/Store4 shape is four typed scalar
                # loads and stores; composite pack/unpack nodes need not survive.
                ok = not untyped and c["OpLoad"] >= 4 and c["OpStore"] >= 4
                case.classification = "typed-alias-compatible" if ok else "legacy-alias-changed"
          ''',
          )
          replace_exact(
              probe,
              '''        ("legacy-alias", "alias"): """
            %a=OpLoad %u %p
            %b=OpLoad %u %p
            %c=OpLoad %u %p
            %d=OpLoad %u %p
            %v=OpCompositeConstruct %v4 %a %b %c %d
            %x0=OpCompositeExtract %u %v 0
            %x1=OpCompositeExtract %u %v 1
            %x2=OpCompositeExtract %u %v 2
            %x3=OpCompositeExtract %u %v 3
            """,
          ''',
              '''        ("legacy-alias", "alias"): """
            %a=OpLoad %u %p
            %b=OpLoad %u %p
            %c=OpLoad %u %p
            %d=OpLoad %u %p
            OpStore %p %a
            OpStore %p %b
            OpStore %p %c
            OpStore %p %d
            """,
          ''',
          )
          replace_all_exact(
              probe,
              "OpUntypedVariableKHR %up Uniform %Raw",
              "OpUntypedVariableKHR %up StorageBuffer %Raw",
              7,
          )
          replace_all_exact(
              probe,
              "%up=OpTypeUntypedPointerKHR Uniform",
              "%up=OpTypeUntypedPointerKHR StorageBuffer",
              2,
          )
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- tools/clang/lib/SPIRV/DeclResultIdMapper.cpp tools/clang/lib/SPIRV/LowerTypeVisitor.cpp tools/clang/lib/SPIRV/SpirvBuilder.cpp utils/amd_vulkan_isa_probe/raw_buffer_vector_probe.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/clang/lib/SPIRV/DeclResultIdMapper.cpp tools/clang/lib/SPIRV/LowerTypeVisitor.cpp tools/clang/lib/SPIRV/SpirvBuilder.cpp utils/amd_vulkan_isa_probe/raw_buffer_vector_probe.py
          if (Test-Path -LiteralPath '.github/rawbuf-patch-trigger') {
            git rm .github/rawbuf-patch-trigger
          }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Fix untyped raw-buffer storage and aliases"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:amd-raw-buffer-vectorization-impl
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Probe self-test
        shell: pwsh
        run: |
          python utils/amd_vulkan_isa_probe/raw_buffer_vector_probe.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          cmake -S . -B build-rawbuf -G Ninja -C cmake\caches\PredefinedParams.cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_SPIRV_CODEGEN=ON -DSPIRV_BUILD_TESTS=OFF -DSPIRV_SKIP_EXECUTABLES=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_BUILD_TESTS=OFF -DCLANG_INCLUDE_TESTS=OFF -DHLSL_INCLUDE_TESTS=OFF
          if errorlevel 1 exit /b %errorlevel%

      # Compile the modified backend and the exact SPIRV-Tools utilities used by
      # the contract before the full compiler so cheap source/tooling failures
      # happen before the expensive complete DXC build.
      - name: Build SPIR-V library and validation tools first
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          cmake --build build-rawbuf --target clangSPIRV spirv-dis spirv-val --parallel 4
          if errorlevel 1 exit /b %errorlevel%

      - name: Build DXC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          cmake --build build-rawbuf --target dxc dxcompiler dxildll --parallel 4
          if errorlevel 1 exit /b %errorlevel%

      - name: Smoke DXIL and SPIR-V
        shell: pwsh
        run: |
          @'
          RWStructuredBuffer<uint> Out : register(u0);
          [numthreads(1,1,1)]
          void main(uint3 tid : SV_DispatchThreadID) { Out[0] = tid.x + 1; }
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\rawbuf_dxc_smoke.hlsl" -Encoding Ascii
          $dxc = (Resolve-Path (Join-Path $PWD 'build-rawbuf\bin\dxc.exe')).Path
          $source = "$env:RUNNER_TEMP\rawbuf_dxc_smoke.hlsl"
          $dxil = "$env:RUNNER_TEMP\rawbuf_dxc_smoke.dxil"
          $spirv = "$env:RUNNER_TEMP\rawbuf_dxc_smoke.spv"
          & $dxc -T cs_6_6 -E main -Fo $dxil $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $spirvArgs = @(
            '-spirv'
            '-fspv-target-env=vulkan1.2'
            '-T'
            'cs_6_6'
            '-E'
            'main'
            '-Fo'
            $spirv
            $source
          )
          & $dxc @spirvArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item -LiteralPath $dxil).Length -eq 0) { throw 'DXIL smoke output is empty' }
          if ((Get-Item -LiteralPath $spirv).Length -eq 0) { throw 'SPIR-V smoke output is empty' }

      - name: Raw-buffer SPIR-V contract
        shell: pwsh
        run: |
          $buildRoot = (Resolve-Path (Join-Path $PWD 'build-rawbuf')).Path
          $dxc = (Resolve-Path (Join-Path $buildRoot 'bin\dxc.exe')).Path
          $spirvDis = Get-ChildItem -LiteralPath $buildRoot -Filter 'spirv-dis.exe' -File -Recurse | Select-Object -First 1 -ExpandProperty FullName
          $spirvVal = Get-ChildItem -LiteralPath $buildRoot -Filter 'spirv-val.exe' -File -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $spirvDis) { throw 'spirv-dis.exe was not produced by the configured SPIRV-Tools build' }
          if (-not $spirvVal) { throw 'spirv-val.exe was not produced by the configured SPIRV-Tools build' }
          $probeArgs = @(
            'utils/amd_vulkan_isa_probe/raw_buffer_vector_probe.py'
            '--dxc'
            $dxc
            '--spirv-dis'
            $spirvDis
            '--spirv-val'
            $spirvVal
            '--target-env'
            'vulkan1.2'
            '--require-untyped-contract'
            '--require-validation'
            '--out-dir'
            (Join-Path $env:RUNNER_TEMP 'raw-buffer-vector-probe')
          )
          & python @probeArgs
          exit $LASTEXITCODE
