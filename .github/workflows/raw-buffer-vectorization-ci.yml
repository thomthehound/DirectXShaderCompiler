name: Raw Buffer Vectorization CI

on:
  push:
    branches:
      - amd-raw-buffer-vectorization-impl
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raw-buffer-vectorization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows focused compiler validation
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # TEMPORARY DELIVERY BOOTSTRAP:
      # The GitHub connector cannot apply a narrow patch to the large mapper
      # translation unit. This step applies cardinality-checked source edits,
      # restores this workflow to its parent version in the same source commit,
      # and commits the real compiler/probe fix before the build below.
      - name: Apply native untyped raw-buffer alias fix
        if: github.event_name == 'push' && github.event.head_commit.message == 'TEMP bootstrap native raw-buffer alias fix'
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(
                      f"{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}"
                  )
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          replace_exact(
              "tools/clang/lib/SPIRV/DeclResultIdMapper.cpp",
              """  if (genAlias) {
              needsLegalization = true;
              createCounterVarForDecl(decl);
            }
          """,
              """  if (genAlias) {
              // Raw-buffer aliases using SPV_KHR_untyped_pointers are native
              // StorageBuffer variable pointers. Do not send them through the
              // legacy HLSL legalizer, whose typed-pointer storage-class pass
              // cannot represent OpTypeUntypedPointerKHR.
              const bool useNativeUntypedRawAlias =
                  !spirvOptions.allowedExtensions.empty() &&
                  featureManager.isExtensionEnabled(
                      Extension::KHR_untyped_pointers) &&
                  (isByteAddressBuffer(type) || isRWByteAddressBuffer(type));
              if (!useNativeUntypedRawAlias)
                needsLegalization = true;
              createCounterVarForDecl(decl);
            }
          """,
          )

          replace_exact(
              "tools/clang/lib/SPIRV/CapabilityVisitor.cpp",
              """  else if (const auto *ptrType = dyn_cast<SpirvPointerType>(type)) {
              addCapabilityForType(ptrType->getPointeeType(), loc,
                                   ptrType->getStorageClass());
              if (ptrType->getStorageClass() ==
                  spv::StorageClass::PhysicalStorageBuffer) {
          """,
              """  else if (const auto *ptrType = dyn_cast<SpirvPointerType>(type)) {
              const SpirvType *pointeeType = ptrType->getPointeeType();

              // A Function-scope holder containing an untyped StorageBuffer
              // pointer is a SPIR-V variable pointer. The restricted
              // StorageBuffer capability is sufficient; do not request the
              // broader VariablePointers capability.
              if (ptrType->getStorageClass() == spv::StorageClass::Function) {
                if (const auto *untypedPtr =
                        dyn_cast<UntypedPointerKHRType>(pointeeType)) {
                  if (untypedPtr->getStorageClass() ==
                      spv::StorageClass::StorageBuffer)
                    addCapability(
                        spv::Capability::VariablePointersStorageBuffer, loc);
                }
              }

              addCapabilityForType(pointeeType, loc, ptrType->getStorageClass());
              if (ptrType->getStorageClass() ==
                  spv::StorageClass::PhysicalStorageBuffer) {
          """,
          )

          probe = Path("utils/amd_vulkan_isa_probe/raw_buffer_vector_probe.py")
          text = probe.read_text(encoding="utf-8")

          old = '        "capability": bool(re.search(r"\\bOpCapability\\s+UntypedPointersKHR\\b", text)),\n'
          new = '''        "capability": bool(re.search(r"\\bOpCapability\\s+UntypedPointersKHR\\b", text)),
                  "variable_pointers_storage_buffer_capability": bool(
                      re.search(
                          r"\\bOpCapability\\s+VariablePointersStorageBuffer\\b", text
                      )
                  ),
          '''
          if text.count(old) != 1:
              raise SystemExit("probe: UntypedPointersKHR capability fact cardinality changed")
          text = text.replace(old, new)

          old = '''            f["extension"]
                      and f["capability"]
                      and c["OpUntypedVariableKHR"] >= 2
                      and int(f["vars_with_data_type"]) >= 2
                      and c["OpUntypedAccessChainKHR"] >= 2
          '''
          new = '''            f["extension"]
                      and f["capability"]
                      and f["variable_pointers_storage_buffer_capability"]
                      and c["OpUntypedVariableKHR"] >= 2
                      and int(f["vars_with_data_type"]) >= 2
                      and c["OpUntypedAccessChainKHR"] >= 2
          '''
          if text.count(old) != 1:
              raise SystemExit("probe: untyped alias classifier cardinality changed")
          text = text.replace(old, new)

          if text.count("OpUntypedVariableKHR %up Uniform %Raw") != 7:
              raise SystemExit("probe: expected seven stale Uniform untyped fixtures")
          text = text.replace(
              "OpUntypedVariableKHR %up Uniform %Raw",
              "OpUntypedVariableKHR %up StorageBuffer %Raw",
          )

          if text.count("%up=OpTypeUntypedPointerKHR Uniform") != 2:
              raise SystemExit("probe: expected two stale Uniform untyped pointer fixtures")
          text = text.replace(
              "%up=OpTypeUntypedPointerKHR Uniform",
              "%up=OpTypeUntypedPointerKHR StorageBuffer",
          )

          old = '        ("untyped-alias", "alias"): """\nOpCapability UntypedPointersKHR\nOpExtension "SPV_KHR_untyped_pointers"\n'
          new = '        ("untyped-alias", "alias"): """\nOpCapability UntypedPointersKHR\nOpCapability VariablePointersStorageBuffer\nOpExtension "SPV_KHR_untyped_pointers"\n'
          if text.count(old) != 1:
              raise SystemExit("probe: untyped alias fixture header cardinality changed")
          text = text.replace(old, new)

          probe.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git checkout HEAD^ -- .github/workflows/raw-buffer-vectorization-ci.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python utils/amd_vulkan_isa_probe/raw_buffer_vector_probe.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git add -- `
            tools/clang/lib/SPIRV/DeclResultIdMapper.cpp `
            tools/clang/lib/SPIRV/CapabilityVisitor.cpp `
            utils/amd_vulkan_isa_probe/raw_buffer_vector_probe.py `
            .github/workflows/raw-buffer-vectorization-ci.yml

          @'
          import subprocess

          expected = {
              ".github/workflows/raw-buffer-vectorization-ci.yml",
              "tools/clang/lib/SPIRV/CapabilityVisitor.cpp",
              "tools/clang/lib/SPIRV/DeclResultIdMapper.cpp",
              "utils/amd_vulkan_isa_probe/raw_buffer_vector_probe.py",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(f"unexpected staged paths: {sorted(actual)}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix native untyped raw-buffer aliases [skip ci]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:amd-raw-buffer-vectorization-impl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probe self-test
        shell: pwsh
        run: |
          python utils/amd_vulkan_isa_probe/raw_buffer_vector_probe.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          cmake -S . -B build-rawbuf -G Ninja -C cmake\caches\PredefinedParams.cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_SPIRV_CODEGEN=ON -DSPIRV_BUILD_TESTS=OFF -DSPIRV_SKIP_EXECUTABLES=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_BUILD_TESTS=OFF -DCLANG_INCLUDE_TESTS=OFF -DHLSL_INCLUDE_TESTS=OFF
          if errorlevel 1 exit /b %errorlevel%

      - name: Build SPIR-V library and validation tools first
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          cmake --build build-rawbuf --target clangSPIRV spirv-dis spirv-val --parallel 4
          if errorlevel 1 exit /b %errorlevel%

      - name: Build DXC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          cmake --build build-rawbuf --target dxc dxcompiler dxildll --parallel 4
          if errorlevel 1 exit /b %errorlevel%

      - name: Smoke DXIL and SPIR-V
        shell: pwsh
        run: |
          @'
          RWStructuredBuffer<uint> Out : register(u0);
          [numthreads(1,1,1)]
          void main(uint3 tid : SV_DispatchThreadID) { Out[0] = tid.x + 1; }
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\rawbuf_dxc_smoke.hlsl" -Encoding Ascii
          $dxc = (Resolve-Path (Join-Path $PWD 'build-rawbuf\bin\dxc.exe')).Path
          $source = "$env:RUNNER_TEMP\rawbuf_dxc_smoke.hlsl"
          $dxil = "$env:RUNNER_TEMP\rawbuf_dxc_smoke.dxil"
          $spirv = "$env:RUNNER_TEMP\rawbuf_dxc_smoke.spv"
          & $dxc -T cs_6_6 -E main -Fo $dxil $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $spirvArgs = @(
            '-spirv'
            '-fspv-target-env=vulkan1.2'
            '-T'
            'cs_6_6'
            '-E'
            'main'
            '-Fo'
            $spirv
            $source
          )
          & $dxc @spirvArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item -LiteralPath $dxil).Length -eq 0) { throw 'DXIL smoke output is empty' }
          if ((Get-Item -LiteralPath $spirv).Length -eq 0) { throw 'SPIR-V smoke output is empty' }

      - name: Raw-buffer SPIR-V contract
        shell: pwsh
        run: |
          $buildRoot = (Resolve-Path (Join-Path $PWD 'build-rawbuf')).Path
          $dxc = (Resolve-Path (Join-Path $buildRoot 'bin\dxc.exe')).Path
          $spirvDis = Get-ChildItem -LiteralPath $buildRoot -Filter 'spirv-dis.exe' -File -Recurse | Select-Object -First 1 -ExpandProperty FullName
          $spirvVal = Get-ChildItem -LiteralPath $buildRoot -Filter 'spirv-val.exe' -File -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $spirvDis) { throw 'spirv-dis.exe was not produced by the configured SPIRV-Tools build' }
          if (-not $spirvVal) { throw 'spirv-val.exe was not produced by the configured SPIRV-Tools build' }
          $probeArgs = @(
            'utils/amd_vulkan_isa_probe/raw_buffer_vector_probe.py'
            '--dxc'
            $dxc
            '--spirv-dis'
            $spirvDis
            '--spirv-val'
            $spirvVal
            '--target-env'
            'vulkan1.2'
            '--require-untyped-contract'
            '--require-validation'
            '--out-dir'
            (Join-Path $env:RUNNER_TEMP 'raw-buffer-vector-probe')
          )
          & python @probeArgs
          exit $LASTEXITCODE
