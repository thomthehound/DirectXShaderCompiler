name: APUSR DXC Build

on:
  push:
    branches:
      - apusr-dxc-linux-build-20260814
      - amd-spirv-native-intrinsics
  workflow_dispatch:

jobs:
  build-linux-dxc:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[windows-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact DXC source and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld

      - name: Configure Release DXC with SPIR-V
        run: |
          cmake -S . -B build-apusr-linux -G Ninja \
            -C cmake/caches/PredefinedParams.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_USE_LINKER=lld \
            -DENABLE_SPIRV_CODEGEN=ON \
            -DSPIRV_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DHLSL_INCLUDE_TESTS=OFF

      - name: Build compiler payload and regression tools
        run: cmake --build build-apusr-linux --target dxc dxcompiler dxildll FileCheck --parallel 4

      - name: Smoke test DXIL and SPIR-V
        run: |
          cat > /tmp/apusr_dxc_smoke.hlsl <<'EOF'
          RWStructuredBuffer<uint> Out : register(u0);
          [numthreads(1,1,1)]
          void main(uint3 tid : SV_DispatchThreadID) { Out[0] = tid.x + 1; }
          EOF
          export LD_LIBRARY_PATH="$PWD/build-apusr-linux/lib:${LD_LIBRARY_PATH:-}"
          build-apusr-linux/bin/dxc -T cs_6_6 -E main -Fo /tmp/apusr_dxc_smoke.dxil /tmp/apusr_dxc_smoke.hlsl
          build-apusr-linux/bin/dxc -spirv -fspv-target-env=vulkan1.2 -T cs_6_6 -E main -Fo /tmp/apusr_dxc_smoke.spv /tmp/apusr_dxc_smoke.hlsl
          test -s /tmp/apusr_dxc_smoke.dxil
          test -s /tmp/apusr_dxc_smoke.spv
          build-apusr-linux/bin/dxc --version

      - name: Test AMD SPIR-V backend contracts
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build-apusr-linux/lib:${LD_LIBRARY_PATH:-}"
          dxc="$PWD/build-apusr-linux/bin/dxc"
          filecheck="$PWD/build-apusr-linux/bin/FileCheck"
          tests="$PWD/tools/clang/test/CodeGenSPIRV"

          "$dxc" -T cs_6_2 -E main -fcgl -spirv -fspv-extension=AMD \
            "$tests/amd.intrinsics.header.hlsl" | \
            "$filecheck" "$tests/amd.intrinsics.header.hlsl"
          "$dxc" -T ps_6_0 -E main -fcgl -spirv -fspv-extension=AMD \
            "$tests/amd.intrinsics.explicit-vertex.hlsl" | \
            "$filecheck" "$tests/amd.intrinsics.explicit-vertex.hlsl"
          "$dxc" -T vs_6_0 -E main -fcgl -spirv -fspv-extension=AMD \
            "$tests/extensions.amd-family.hlsl" | \
            "$filecheck" "$tests/extensions.amd-family.hlsl"
          "$dxc" -T vs_6_0 -E main -fcgl -spirv \
            -fspv-enable-amd-intrinsics \
            "$tests/intrinsics.msad4.amd.hlsl" | \
            "$filecheck" "$tests/intrinsics.msad4.amd.hlsl" \
              --check-prefix=AMD
          "$dxc" -T cs_6_10 -E main -fcgl -spirv \
            -fspv-target-env=vulkan1.3 \
            "$tests/linalg.cooperative-matrix.amd.hlsl" | \
            "$filecheck" "$tests/linalg.cooperative-matrix.amd.hlsl"

          set +e
          strict_output=$("$dxc" -T vs_6_0 -E main -fcgl -spirv \
            -fspv-require-native-intrinsics \
            "$tests/intrinsics.msad4.amd.hlsl" 2>&1)
          strict_status=$?
          set -e
          test "$strict_status" -ne 0
          printf '%s\n' "$strict_output" | \
            "$filecheck" "$tests/intrinsics.msad4.amd.hlsl" \
              --check-prefix=STRICT

          set +e
          thread_output=$("$dxc" -T cs_6_10 -E main -fcgl -spirv \
            -fspv-target-env=vulkan1.3 \
            "$tests/linalg.thread-scope-no-fake-amd.hlsl" 2>&1)
          thread_status=$?
          set -e
          test "$thread_status" -ne 0
          printf '%s\n' "$thread_output" | \
            "$filecheck" "$tests/linalg.thread-scope-no-fake-amd.hlsl"

      - name: Stage exact payload
        run: |
          mkdir -p artifact/bin artifact/licenses
          cp -L build-apusr-linux/bin/dxc artifact/bin/dxc
          cp build-apusr-linux/lib/libdxcompiler.so artifact/bin/libdxcompiler.so
          cp build-apusr-linux/lib/libdxil.so artifact/bin/libdxil.so
          cp LICENSE.TXT artifact/licenses/LICENSE.TXT
          git rev-parse HEAD > artifact/DXC_COMMIT.txt
          git submodule status --recursive > artifact/DXC_SUBMODULES.txt
          build-apusr-linux/bin/dxc --version > artifact/DXC_VERSION.txt
          (cd artifact && sha256sum bin/* > SHA256SUMS.txt)

      - name: Upload Linux DXC payload
        uses: actions/upload-artifact@v4
        with:
          name: amd-spirv-linux-dxc-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          retention-days: 1

  build-windows-dxc:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact DXC source and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 1

      - name: Configure and build Release DXC with SPIR-V
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          cmake -S . -B build-apusr-windows -G Ninja -C cmake\caches\PredefinedParams.cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_SPIRV_CODEGEN=ON -DSPIRV_BUILD_TESTS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_BUILD_TESTS=OFF -DCLANG_INCLUDE_TESTS=OFF -DHLSL_INCLUDE_TESTS=OFF
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build-apusr-windows --target dxc dxcompiler dxildll --parallel 4
          if errorlevel 1 exit /b %errorlevel%

      - name: Smoke test DXIL and SPIR-V
        shell: pwsh
        run: |
          @'
          RWStructuredBuffer<uint> Out : register(u0);
          [numthreads(1,1,1)]
          void main(uint3 tid : SV_DispatchThreadID) { Out[0] = tid.x + 1; }
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\apusr_dxc_smoke.hlsl" -Encoding Ascii
          $dxc = Join-Path $PWD 'build-apusr-windows\bin\dxc.exe'
          $source = "$env:RUNNER_TEMP\apusr_dxc_smoke.hlsl"
          $dxil = "$env:RUNNER_TEMP\apusr_dxc_smoke.dxil"
          $spirv = "$env:RUNNER_TEMP\apusr_dxc_smoke.spv"
          $dxilArgs = @('-T', 'cs_6_6', '-E', 'main', '-Fo', $dxil, $source)
          & $dxc @dxilArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $spirvArgs = @('-spirv', '-fspv-target-env=vulkan1.2', '-T', 'cs_6_6', '-E', 'main', '-Fo', $spirv, $source)
          & $dxc @spirvArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item $dxil).Length -eq 0) { throw 'DXIL smoke output is empty' }
          if ((Get-Item $spirv).Length -eq 0) { throw 'SPIR-V smoke output is empty' }
          & $dxc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage exact payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact\bin, artifact\licenses | Out-Null
          Copy-Item build-apusr-windows\bin\dxc.exe artifact\bin\dxc.exe
          Copy-Item build-apusr-windows\bin\dxcompiler.dll artifact\bin\dxcompiler.dll
          Copy-Item build-apusr-windows\bin\dxil.dll artifact\bin\dxil.dll
          Copy-Item LICENSE.TXT artifact\licenses\LICENSE.TXT
          (git rev-parse HEAD) | Set-Content artifact\DXC_COMMIT.txt -Encoding Ascii
          (git submodule status --recursive) | Set-Content artifact\DXC_SUBMODULES.txt -Encoding Ascii
          (& build-apusr-windows\bin\dxc.exe --version 2>&1) | Set-Content artifact\DXC_VERSION.txt -Encoding Ascii
          Get-ChildItem artifact\bin | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  bin/$($_.Name)"
          } | Set-Content artifact\SHA256SUMS.txt -Encoding Ascii

      - name: Upload Windows DXC payload
        uses: actions/upload-artifact@v4
        with:
          name: amd-spirv-windows-dxc-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          retention-days: 1
