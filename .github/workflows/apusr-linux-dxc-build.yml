name: APUSR Linux DXC Build

on:
  push:
    branches:
      - apusr-dxc-linux-build-20260814
  workflow_dispatch:

jobs:
  build-linux-dxc:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld

      - name: Configure Release DXC with SPIR-V
        run: |
          cmake -S . -B build-apusr-linux -G Ninja \
            -C cmake/caches/PredefinedParams.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_USE_LINKER=lld \
            -DENABLE_SPIRV_CODEGEN=ON \
            -DSPIRV_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DHLSL_INCLUDE_TESTS=OFF

      - name: Build compiler payload
        run: cmake --build build-apusr-linux --target dxc dxcompiler dxildll --parallel 2

      - name: Smoke test DXIL and SPIR-V
        run: |
          cat > /tmp/apusr_dxc_smoke.hlsl <<'EOF'
          RWStructuredBuffer<uint> Out : register(u0);
          [numthreads(1,1,1)]
          void main(uint3 tid : SV_DispatchThreadID) { Out[0] = tid.x + 1; }
          EOF
          export LD_LIBRARY_PATH="$PWD/build-apusr-linux/bin:${LD_LIBRARY_PATH:-}"
          build-apusr-linux/bin/dxc -T cs_6_6 -E main -Fo /tmp/apusr_dxc_smoke.dxil /tmp/apusr_dxc_smoke.hlsl
          build-apusr-linux/bin/dxc -spirv -fspv-target-env=vulkan1.2 -T cs_6_6 -E main -Fo /tmp/apusr_dxc_smoke.spv /tmp/apusr_dxc_smoke.hlsl
          test -s /tmp/apusr_dxc_smoke.dxil
          test -s /tmp/apusr_dxc_smoke.spv
          build-apusr-linux/bin/dxc --version

      - name: Stage exact payload
        run: |
          mkdir -p artifact/bin artifact/licenses
          cp build-apusr-linux/bin/dxc artifact/bin/
          cp build-apusr-linux/bin/libdxcompiler.so artifact/bin/
          cp build-apusr-linux/bin/libdxil.so artifact/bin/
          cp LICENSE.TXT artifact/licenses/LICENSE.TXT
          git rev-parse HEAD > artifact/DXC_COMMIT.txt
          git submodule status --recursive > artifact/DXC_SUBMODULES.txt
          sha256sum artifact/bin/* > artifact/SHA256SUMS.txt

      - name: Upload Linux DXC payload
        uses: actions/upload-artifact@v4
        with:
          name: apusr-linux-dxc-672266879a72077c975dd1a86819ebf34606e229
          path: artifact
          if-no-files-found: error
          retention-days: 1
